<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="BIND to Route 53 Mirror Walkthrough">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#232F3E"/>
      <stop offset="1" stop-color="#131a22"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx="0.5" cy="0.35" r="0.6" gradientUnits="objectBoundingBox">
      <stop stop-color="#8C4FFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8C4FFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ogGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94a3b8" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" rx="12" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>
  <rect x="1" y="1" width="1198" height="628" rx="11" stroke="#FF9900" stroke-width="1" fill="none" opacity="0.35"/>

  <text x="600" y="70" text-anchor="middle" fill="#f4f1f8" font-family="sans-serif" font-size="42" font-weight="700">BIND to Route 53 Mirror</text>
  <text x="600" y="112" text-anchor="middle" fill="#b8afc8" font-family="sans-serif" font-size="22">Legacy BIND stays on-prem — cloud workloads resolve via Route 53</text>

  <rect x="220" y="140" width="200" height="36" rx="18" fill="#243040" stroke="#ED7100" stroke-width="1"/>
  <text x="320" y="163" text-anchor="middle" fill="#e8e0f4" font-family="sans-serif" font-size="15" font-weight="600">BIND authority</text>
  <rect x="440" y="140" width="160" height="36" rx="18" fill="#243040" stroke="#FF9900" stroke-width="1"/>
  <text x="520" y="163" text-anchor="middle" fill="#e8e0f4" font-family="sans-serif" font-size="15" font-weight="600">AXFR sync</text>
  <rect x="620" y="140" width="360" height="36" rx="18" fill="#243040" stroke="#8C4FFF" stroke-width="1"/>
  <text x="800" y="163" text-anchor="middle" fill="#e8e0f4" font-family="sans-serif" font-size="15" font-weight="600">Route 53 private hosted zone</text>

  <rect x="48" y="200" width="1104" height="350" rx="14" fill="#1a2332" stroke="#3d4f63" stroke-width="1"/>
  <rect x="48" y="200" width="1104" height="350" rx="14" fill="url(#ogGrid)" opacity="0.5"/>

  <!-- On-prem -->
  <rect x="88" y="236" width="400" height="280" rx="12" fill="#1e2936" stroke="#ED7100" stroke-width="1.5"/>
  <text x="288" y="278" text-anchor="middle" fill="#ED7100" font-family="sans-serif" font-size="20" font-weight="700">On-prem (legacy)</text>
  <text x="288" y="306" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">DNS source of truth</text>

  <rect x="128" y="336" width="320" height="64" rx="8" fill="#243040" stroke="#3d4f63" stroke-width="1"/>
  <text x="288" y="362" text-anchor="middle" fill="#f4f1f8" font-family="sans-serif" font-size="17" font-weight="600">BIND master</text>
  <text x="288" y="386" text-anchor="middle" fill="#9b92b0" font-family="sans-serif" font-size="13">corp.internal · authoritative</text>

  <rect x="128" y="416" width="320" height="64" rx="8" fill="#243040" stroke="#3d4f63" stroke-width="1"/>
  <text x="288" y="442" text-anchor="middle" fill="#f4f1f8" font-family="sans-serif" font-size="17" font-weight="600">Zone edits stay here</text>
  <text x="288" y="466" text-anchor="middle" fill="#9b92b0" font-family="sans-serif" font-size="13">no cloud cutover required</text>

  <!-- Cloud -->
  <rect x="712" y="236" width="400" height="280" rx="12" fill="#1e2936" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="912" y="278" text-anchor="middle" fill="#8C4FFF" font-family="sans-serif" font-size="20" font-weight="700">Cloud workloads</text>
  <text x="912" y="306" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">Same private names</text>

  <rect x="752" y="336" width="320" height="64" rx="8" fill="#243040" stroke="#3d4f63" stroke-width="1"/>
  <text x="912" y="362" text-anchor="middle" fill="#f4f1f8" font-family="sans-serif" font-size="17" font-weight="600">Route 53 PHZ</text>
  <text x="912" y="386" text-anchor="middle" fill="#9b92b0" font-family="sans-serif" font-size="13">read-only mirror</text>

  <rect x="752" y="416" width="320" height="64" rx="8" fill="#243040" stroke="#3d4f63" stroke-width="1"/>
  <text x="912" y="442" text-anchor="middle" fill="#f4f1f8" font-family="sans-serif" font-size="17" font-weight="600">AmazonProvidedDNS</text>
  <text x="912" y="466" text-anchor="middle" fill="#9b92b0" font-family="sans-serif" font-size="13">VPC resolve · no direct BIND</text>

  <!-- Mirror arrow -->
  <line x1="508" y1="376" x2="682" y2="376" stroke="#FF9900" stroke-width="3" stroke-linecap="round"/>
  <polygon points="672,368 692,376 672,384" fill="#FF9900"/>
  <text x="600" y="358" text-anchor="middle" fill="#FF9900" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="0.08em">MIRROR</text>

  <text x="600" y="588" text-anchor="middle" fill="#9b92b0" font-family="sans-serif" font-size="18">Walkthrough companion · jajera/bind-to-route53-mirror-demo</text>
  <text x="600" y="616" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">jajera.github.io/bind-to-route53-mirror-walkthrough</text>
</svg>
